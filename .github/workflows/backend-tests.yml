name: Backend Tests

on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-tests.yml"

  pull_request:
    branches:
      - main
      - "release/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.13 / PostgreSQL ${{ matrix.postgres-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        postgres-version: [16, 18]

    env:
      PYTHONUNBUFFERED: "1"

      SECRET_KEY: test-only-ci-secret-key
      DEBUG: "false"

      DATABASE_URL: >-
        postgresql+psycopg://postgres:postgres@localhost:5432/aqlyra_rag_ai

      TEST_DATABASE_URL: >-
        postgresql+psycopg://postgres:postgres@localhost:5432/aqlyra_rag_ai_test

      UPLOAD_DIR: /tmp/aqlyra-rag-ci-uploads

      EMBEDDING_PROVIDER: deterministic
      LLM_PROVIDER: deterministic

    services:
      postgres:
        image: pgvector/pgvector:pg${{ matrix.postgres-version }}

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aqlyra_rag_ai

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d aqlyra_rag_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      # psycopg is a pinned application dependency. Avoid the runner-host
      # apt repository entirely: Ubuntu mirror DNS outages must not make
      # otherwise-correct PostgreSQL integration tests fail before startup.
      - name: Prepare PostgreSQL databases via pinned psycopg
        run: |
          python - <<'PY'
          import psycopg
          from psycopg import sql

          # Disposable Actions service only; never a production database.
          connection = "host=localhost port=5432 user=postgres password=postgres"
          with psycopg.connect(
              connection + " dbname=postgres", autocommit=True
          ) as db:
              existing = db.execute(
                  "SELECT 1 FROM pg_database WHERE datname = %s",
                  ("aqlyra_rag_ai_test",),
              ).fetchone()
              if existing is None:
                  db.execute(
                      sql.SQL("CREATE DATABASE {}").format(
                          sql.Identifier("aqlyra_rag_ai_test")
                      )
                  )

          for database_name in ("aqlyra_rag_ai", "aqlyra_rag_ai_test"):
              with psycopg.connect(
                  connection + " dbname=" + database_name, autocommit=True,
              ) as db:
                  db.execute("CREATE EXTENSION IF NOT EXISTS vector")
                  row = db.execute(
                      "SELECT extname FROM pg_extension WHERE extname = 'vector'"
                  ).fetchone()
                  assert row == ("vector",), "pgvector is unavailable"
          print("CI_DISPOSABLE_PGVECTOR_PREP=PASS")
          PY

      - name: Verify Alembic migrations
        working-directory: backend
        run: |
          alembic upgrade head
          alembic current

      - name: Run backend tests
        working-directory: backend
        run: |
          python -m pytest

      - name: Verify benchmark cannot target real production or paid AI providers
        if: matrix.postgres-version == 16
        working-directory: scripts/ops
        run: |
          python -m pytest -q test_ephemeral_chat_load.py

      - name: Run two-user HTTP privacy/RAG E2E and bounded 10-100 synthetic chat load
        if: matrix.postgres-version == 16
        env:
          AQLYRA_DISPOSABLE_LOAD_CONFIRMED: "yes"
          APP_ENV: development
          EMAIL_VERIFICATION_REQUIRED: "false"
          RATE_LIMIT_ENABLED: "false"
          WEB_RESEARCH_ENABLED: "false"
        run: |
          set -Eeuo pipefail
          test "$LLM_PROVIDER" = "deterministic"
          test "$EMBEDDING_PROVIDER" = "deterministic"
          cd backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000             > /tmp/aqlyra-concurrency-backend.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 3               http://127.0.0.1:8000/api/v1/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Disposable backend did not become ready"
            exit 1
          fi
          cd ..
          # Existing owner-vs-nonowner HTTP acceptance now runs for real
          # against this disposable local FastAPI + pgvector stack.
          # Guarded strictly to loopback / deterministic providers.
          python scripts/ops/ephemeral_fullstack_e2e.py --base-url http://127.0.0.1:8000
          python scripts/ops/ephemeral_chat_load.py             --base-url http://127.0.0.1:8000             --report-file /tmp/aqlyra-synthetic-chat-load.json
          echo "Synthetic concurrency measurement complete"

      - name: Print safe concurrency report (no user data)
        if: matrix.postgres-version == 16 && always()
        run: |
          if [ -f /tmp/aqlyra-synthetic-chat-load.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(
              Path("/tmp/aqlyra-synthetic-chat-load.json").read_text()
          )
          print("CI_ONLY_SYNTHETIC_LOAD")
          for item in report["tiers"]:
              print(
                  f"Users={item['requested_concurrent_users']} "
                  f"success={item['successes']}/{item['requests']} "
                  f"p95={item['p95_latency_ms']}ms "
                  f"rps={item['successful_rps']} "
                  f"slo={item['illustrative_ci_slo']}"
              )
          PY
          fi

  # Always verify the same standalone no-pip environment used by the
  # Frontend Deployment and Always-on Merge Gate workflows. Do not assume
  # the backend's pytest installation is available in these jobs.
  offline-ops-unittest:
    name: Standalone operations unittest gate (no pip dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Reproduce no-pytest merge-gate environment
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q scripts/ops
          python3 -m unittest discover -s scripts/ops -p 'test_*.py' -v
