name: Dependency Security Audit

on:
  push:
    branches: [main, fix/password-reset-chat-provider-20261029]
    paths:
      - "backend/requirements*.txt"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/dependency-audit.yml"
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-dependencies:
    name: npm security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit production dependency graph (release gate)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Report development-tooling advisories (non-blocking)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high

  backend-dependencies:
    name: Python security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install independent vulnerability auditor
        run: python -m pip install pip-audit==2.10.1
      - name: Audit pinned backend dependencies
        run: pip-audit --no-deps --disable-pip -r backend/requirements.txt
      - name: Audit pinned voice worker dependencies
        run: pip-audit --no-deps --disable-pip -r backend/requirements-voice.txt
