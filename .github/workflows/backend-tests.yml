name: Backend Tests

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-tests.yml"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.13 / PostgreSQL ${{ matrix.postgres-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        postgres-version: [16, 18]

    env:
      PYTHONUNBUFFERED: "1"

      SECRET_KEY: test-only-ci-secret-key
      DEBUG: "false"

      DATABASE_URL: >-
        postgresql+psycopg://postgres:postgres@localhost:5432/aqlyra_rag_ai

      TEST_DATABASE_URL: >-
        postgresql+psycopg://postgres:postgres@localhost:5432/aqlyra_rag_ai_test

      UPLOAD_DIR: /tmp/aqlyra-rag-ci-uploads

      EMBEDDING_PROVIDER: deterministic
      LLM_PROVIDER: deterministic

    services:
      postgres:
        image: pgvector/pgvector:pg${{ matrix.postgres-version }}

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aqlyra_rag_ai

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d aqlyra_rag_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Prepare PostgreSQL databases
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            --host localhost \
            --username postgres \
            --dbname postgres \
            --set ON_ERROR_STOP=1 <<'SQL'
          SELECT 'CREATE DATABASE aqlyra_rag_ai_test'
          WHERE NOT EXISTS (
              SELECT
              FROM pg_database
              WHERE datname = 'aqlyra_rag_ai_test'
          )
          \gexec

          \connect aqlyra_rag_ai
          CREATE EXTENSION IF NOT EXISTS vector;

          \connect aqlyra_rag_ai_test
          CREATE EXTENSION IF NOT EXISTS vector;
          SQL

      - name: Verify Alembic migrations
        working-directory: backend
        run: |
          alembic upgrade head
          alembic current

      - name: Run backend tests
        working-directory: backend
        run: |
          python -m pytest
