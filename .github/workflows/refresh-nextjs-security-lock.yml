# Temporary branch-scoped lockfile regeneration. Remove before merging.
name: Temporary Next.js Lockfile Refresh
on:
  push:
    branches:
      - security/nextjs-16-4-3-patch
    paths:
      - frontend/package.json

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'naim-munshi/aqlyra-rag-ai' && github.ref == 'refs/heads/security/nextjs-16-4-3-patch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Refresh package lock from npm registry
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package-lock.json'); if(p.packages['node_modules/next']?.version!=='16.4.3' || p.packages['node_modules/eslint-config-next']?.version!=='16.4.3') process.exit(1)"
      - name: Commit ONLY the regenerated lockfile
        run: |
          set -euo pipefail
          git diff --check
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already matches manifest'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(deps): regenerate patched Next.js npm lockfile'
          git push origin HEAD:security/nextjs-16-4-3-patch
