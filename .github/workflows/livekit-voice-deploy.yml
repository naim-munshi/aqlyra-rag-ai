name: Deploy Aqlyra voice to LiveKit Cloud

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aqlyra-livekit-voice-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'fix/voice-call-reliability-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: livekit-voice-staging
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Verify expected voice sources
        run: |
          test -f Dockerfile.voice
          test -f livekit.yaml
          test -f app/voice/preflight.py
          test -f app/voice/worker.py
          test -f requirements-voice.txt
      - name: Validate deployment credentials and configuration
        env:
          APP_ENV: production
          AQLYRA_PROCESS_ROLE: voice_worker
          RATE_LIMIT_ENABLED: 'true'
          RAG_GROUNDING_VERIFIER_ENABLED: 'true'
          LLM_PROVIDER: groq
          LLM_MODEL: openai/gpt-oss-20b
          EMBEDDING_PROVIDER: ${{ vars.EMBEDDING_PROVIDER }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VOICE_AGENT_NAME: aqlyra-voice
          VOICE_STT_PROVIDER: livekit
          VOICE_STT_MODEL: deepgram/nova-3
          VOICE_STT_LANGUAGE: multi
          VOICE_SESSION_LLM_PROVIDER: livekit
          VOICE_SESSION_LLM_MODEL: openai/gpt-oss-120b
          VOICE_TTS_MODEL: cartesia/sonic-3
          VOICE_TTS_VOICE: ${{ vars.VOICE_TTS_VOICE }}
        run: |
          python -m app.voice.preflight
      - name: Install LiveKit CLI
        run: |
          curl -fsSL https://get.livekit.io/cli | bash
          lk --version
      - name: Deploy existing voice agent
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          lk agent create --help
          echo 'Preflight complete. Agent deploy requires runtime secrets to be provisioned in LiveKit Cloud.'
          exit 1
