services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aqlyra-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aqlyra_rag_ai

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d aqlyra_rag_ai
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: aqlyra-backend

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      PROJECT_NAME: Aqlyra RAG AI
      VERSION: 1.0.0
      API_V1_STR: /api/v1
      DEBUG: "false"

      SECRET_KEY: docker-local-secret-change-before-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"

      DATABASE_URL: >-
        postgresql+psycopg://postgres:postgres@postgres:5432/aqlyra_rag_ai

      REDIS_URL: redis://localhost:6379/0

      OPENAI_API_KEY: ""

      EMBEDDING_PROVIDER: deterministic
      EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_DIMENSION: "384"
      EMBEDDING_MAX_BATCH_SIZE: "128"
      EMBEDDING_TIMEOUT_SECONDS: "30"
      EMBEDDING_MAX_RETRIES: "3"

      LLM_PROVIDER: deterministic
      LLM_MODEL: gpt-5
      LLM_MAX_OUTPUT_TOKENS: "800"
      LLM_TIMEOUT_SECONDS: "60"
      LLM_MAX_RETRIES: "2"

      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE_MB: "25"
      UPLOAD_CHUNK_SIZE_BYTES: "1048576"
      ALLOWED_DOCUMENT_EXTENSIONS: >-
        .pdf,.docx,.xlsx,.pptx,.txt,.md,.csv

      LOG_LEVEL: INFO

    ports:
      - "8000:8000"

    volumes:
      - uploads_data:/app/uploads

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/api/v1/health',
          timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  uploads_data:
