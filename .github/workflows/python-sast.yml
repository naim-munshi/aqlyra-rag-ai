name: Python Static Application Security Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  high-severity-python-sast:
    name: High-severity Python SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install pinned Bandit scanner
        run: python -m pip install --disable-pip-version-check bandit==1.9.4

      - name: Scan production Python source for high-severity security findings
        run: |
          bandit \
            --recursive backend scripts/ops \
            --exclude backend/tests \
            --severity-level high \
            --ignore-nosec \
            --format screen
