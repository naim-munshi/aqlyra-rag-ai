services:
  redis:
    image: redis:8-alpine
    container_name: aqlyra-redis

    restart: unless-stopped

    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: aqlyra-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aqlyra_rag_ai}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}

    container_name: aqlyra-backend

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      APP_ENV: ${APP_ENV:-development}
      PROJECT_NAME: Aqlyra RAG AI
      VERSION: 1.0.0
      API_V1_STR: /api/v1
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: >-
        ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}

      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"

      DATABASE_URL: >-
        ${DATABASE_URL_DOCKER:-postgresql+psycopg://postgres:postgres@postgres:5432/aqlyra_rag_ai}

      REDIS_URL: >-
        ${REDIS_URL_DOCKER:-redis://redis:6379/0}

      HF_TOKEN: ${HF_TOKEN:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-deterministic}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-deterministic-sha256-v1}
      EMBEDDING_DIMENSION: "384"
      EMBEDDING_MAX_BATCH_SIZE: "128"
      EMBEDDING_TIMEOUT_SECONDS: "30"
      EMBEDDING_MAX_RETRIES: "3"

      LLM_TIMEOUT_SECONDS: "60"
      LLM_MAX_RETRIES: "2"

      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE_MB: "25"
      UPLOAD_CHUNK_SIZE_BYTES: "1048576"
      ALLOWED_DOCUMENT_EXTENSIONS: >-
        .pdf,.docx,.xlsx,.pptx,.txt,.md,.csv,.png,.jpg,.jpeg,.webp

      LOG_LEVEL: INFO

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - uploads_data:/app/uploads

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/api/v1/readiness',
          timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  voice-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.voice

    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}

    container_name: aqlyra-voice-worker

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      PROJECT_NAME: Aqlyra RAG AI
      VERSION: 1.0.0
      DEBUG: "false"

      DATABASE_URL: >-
        ${DATABASE_URL_DOCKER:-postgresql+psycopg://postgres:postgres@postgres:5432/aqlyra_rag_ai}

      HF_TOKEN: ${HF_TOKEN:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-deterministic}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-deterministic-sha256-v1}
      EMBEDDING_DIMENSION: "384"
      EMBEDDING_MAX_BATCH_SIZE: "128"
      EMBEDDING_TIMEOUT_SECONDS: "30"
      EMBEDDING_MAX_RETRIES: "3"

      LLM_TIMEOUT_SECONDS: "60"
      LLM_MAX_RETRIES: "2"

      UPLOAD_DIR: /app/uploads
      LOG_LEVEL: INFO

    volumes:
      - uploads_data:/app/uploads



  frontend:
    profiles:
      - production
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aqlyra-frontend
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      BACKEND_API_URL: http://backend:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  caddy:
    profiles:
      - production
    image: caddy:2-alpine
    container_name: aqlyra-caddy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
