# Branch-only, one-shot dev dependency security fix; remove before merge.
name: Temporary Zod Security Lock Refresh
on:
  push:
    branches: [security/nextjs-16-4-3-patch]
    paths:
      - .github/workflows/refresh-zod-security-lock.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'naim-munshi/aqlyra-rag-ai' && github.ref == 'refs/heads/security/nextjs-16-4-3-patch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Regenerate only transitive Zod lock resolution
        working-directory: frontend
        run: |
          set -euo pipefail
          npm update zod --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package-lock.json'); const v=p.packages['node_modules/zod']?.version; if(!v || Number(v.split('.')[0])!==4 || Number(v.split('.')[1])<6 || (Number(v.split('.')[1])===6 && Number(v.split('.')[2])<6)) process.exit(1)"
          npm audit --audit-level=high
      - name: Commit npm-generated lockfile only
        run: |
          set -euo pipefail
          git diff --check
          git add frontend/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security(deps): patch transitive Zod development advisory'
          git push origin HEAD:security/nextjs-16-4-3-patch
