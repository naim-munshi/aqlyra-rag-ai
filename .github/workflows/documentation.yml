name: Documentation Consistency

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "scripts/ops/check_markdown_docs.py"
      - ".github/workflows/documentation.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
      - "scripts/ops/check_markdown_docs.py"
      - ".github/workflows/documentation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links-and-fences:
    name: Check Markdown links and code fences
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate tracked Markdown documents
        run: python3 scripts/ops/check_markdown_docs.py
