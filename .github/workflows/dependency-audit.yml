name: Dependency Security Audit

on:
  push:
    branches: [main]
    paths:
      - "backend/requirements*.txt"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/dependency-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/requirements*.txt"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-dependencies:
    name: npm security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit locked npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  backend-dependencies:
    name: Python security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install independent vulnerability auditor
        run: python -m pip install pip-audit==2.10.1
      - name: Audit pinned backend dependencies
        run: pip-audit --no-deps --disable-pip -r backend/requirements.txt
      - name: Audit pinned voice worker dependencies
        run: pip-audit --no-deps --disable-pip -r backend/requirements-voice.txt
