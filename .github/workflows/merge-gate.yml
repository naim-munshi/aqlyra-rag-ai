name: Always-on Merge Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge-gate:
    name: Always-on Merge Gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate operations script syntax
        run: |
          set -Eeuo pipefail
          for script in scripts/ops/*.sh; do
            bash -n "$script"
          done
          python3 -m compileall -q scripts/ops

      - name: Run all offline operations regression tests
        run: python3 -m unittest discover -s scripts/ops -p 'test_*.py' -v

      - name: Verify documented local links
        run: python3 scripts/ops/check_markdown_docs.py

      - name: Verify private Mac-only Compose profile
        run: |
          set -Eeuo pipefail
          BACKEND_ENV_FILE=./backend/.env.example \
            docker compose \
            --env-file backend/.env.example \
            --file docker-compose.yml \
            --file docker-compose.mac-local.yml \
            --profile production \
            config --format json \
            | python3 scripts/ops/check_mac_local_compose.py

      - name: Verify production Compose security and storage contract
        env:
          BACKEND_ENV_FILE: ./backend/.env.production.example
        run: |
          set -Eeuo pipefail
          docker compose \
            --env-file backend/.env.production.example \
            --profile production \
            config --format json \
            | python3 scripts/ops/deployment_contract.py
