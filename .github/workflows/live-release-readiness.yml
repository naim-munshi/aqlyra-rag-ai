name: Live Release Readiness (read-only)

on:
  push:
    branches:
      - release/full-with-study-abroad-20261028
    paths:
      - 'scripts/ops/live_release_probe.py'
      - '.github/workflows/live-release-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-release-gate:
    name: Observe Aqlyra Render full-stack readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Probe fixed Aqlyra API without credentials or mutations
        run: python3 scripts/ops/live_release_probe.py
