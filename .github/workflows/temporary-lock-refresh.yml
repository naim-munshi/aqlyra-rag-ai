name: Temporary npm lockfile refresh

on:
  push:
    branches:
      - security/npm-lock-refresh-20261012
    paths:
      - ".github/workflows/temporary-lock-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate patched dependency lock without install scripts
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts --no-fund \
            --save-exact next@16.4.0 eslint-config-next@16.4.0
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm ci --dry-run --ignore-scripts --no-audit --no-fund

      - name: Show post-update production dependency audit
        working-directory: frontend
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Commit and push only package metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(deps): refresh Next.js and patched npm lockfile"
          gh auth setup-git
          git push origin HEAD:refs/heads/security/npm-lock-refresh-20261012
