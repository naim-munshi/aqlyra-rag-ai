name: Frontend and Deployment Checks

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.yml"
      - "Caddyfile"
      - "scripts/ops/**"
      - "docs/STAGING.md"
      - ".github/workflows/frontend-deployment.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint source
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test cross-origin API protection
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Build Next.js for production
        run: npm run build

  staging-smoke-unit:
    name: Validate staging smoke contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run standalone smoke tests
        run: python3 -m unittest discover -s scripts/ops -p 'test_staging_smoke.py' -v

  deployment-config:
    name: Validate production Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate operational shell script syntax
        run: |
          for script in scripts/ops/*.sh; do
            bash -n "$script"
          done
      - name: Validate OCI and network contract Python syntax
        run: >-
          python3 -m py_compile
          scripts/ops/oci_host_preflight.py
          scripts/ops/deployment_contract.py
          scripts/ops/performance_probe.py
      - name: Run deployment security regression tests
        run: >-
          python3 -m unittest discover
          -s scripts/ops -p 'test_*.py' -v
      - name: Validate production Compose profile
        env:
          BACKEND_ENV_FILE: ./backend/.env.production.example
        run: >-
          docker compose
          --env-file backend/.env.production.example
          --profile production
          config --quiet

      - name: Audit production Compose security boundaries
        env:
          BACKEND_ENV_FILE: ./backend/.env.production.example
        run: |
          docker compose \
            --env-file backend/.env.production.example \
            --profile production \
            config --format json \
            | python3 scripts/ops/deployment_contract.py

      - name: Validate Caddy reverse-proxy configuration
        run: |
          docker run --rm \
            --env APP_DOMAIN=staging.example.com \
            --env CADDY_EMAIL=ops@example.com \
            --volume "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  container-build:
    name: Build production Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build backend, frontend and voice-worker images
        env:
          BACKEND_ENV_FILE: ./backend/.env.production.example
          DOCKER_BUILDKIT: "1"
        run: >-
          docker compose
          --env-file backend/.env.production.example
          --profile production
          build backend frontend voice-worker

      - name: Assert application containers run without root
        env:
          BACKEND_ENV_FILE: ./backend/.env.production.example
        run: |
          for service in backend frontend voice-worker; do
            uid="$(
              docker compose \
                --env-file backend/.env.production.example \
                --profile production \
                run --rm --no-deps --entrypoint id "$service" -u
            )"
            if [ "$uid" = "0" ]; then
              echo "FAIL: $service container runs as root" >&2
              exit 1
            fi
            echo "PASS: $service uid=$uid"
          done
      - name: Start backend and verify fresh-volume readiness
        env:
          BACKEND_ENV_FILE: ./backend/.env.example
        run: |
          set -Eeuo pipefail
          cleanup() {
            docker compose --env-file backend/.env.example down --remove-orphans
          }
          trap cleanup EXIT
          docker compose --env-file backend/.env.example up -d postgres redis backend
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 4 http://127.0.0.1:8000/api/v1/readiness; then
              ready=1
              break
            fi
            sleep 3
          done
          if [ "$ready" -ne 1 ]; then
            docker compose --env-file backend/.env.example ps
            docker compose --env-file backend/.env.example logs --no-color --tail 70 backend
            exit 1
          fi
          echo "Fresh-volume backend readiness PASS"

